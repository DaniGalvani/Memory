<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory - Playboard</title>
  </head>
  <body onload="init()">
    <main class="playboard-main">
      <div class="playboard">
        <header class="playboard__header">
          <div class="player-info">
            <div class="player-points" id="playerpoints">
              <div><img src="./assets/img/blue.svg" alt="Player Points"><span class="points-blue" id="points">0</span></div>
              <div><img src="./assets/img/orange.svg" alt="Player Points"><span class="points-orange" id="points">0</span></div>
            </div>
            <div class="current-player" id="currentplayer">Current player: <span id="player"><img src="./assets/icons/label.svg" alt="Current Player"></span></div>
          </div>
          <button class="game-exit"><img src="./assets/icons/move-item.svg" alt="Exit game">Exit game</button>
        </header>
        <section class="play-cards" id="playcards"></section>
      </div>
    </main>
    <script type="module" src="./src/playboard.ts"></script>
  </body>
</html>
