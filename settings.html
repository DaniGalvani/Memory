<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory - Settings</title>
  </head>
  <body>
    <main class="main-container">
      <div class="container">
        <h1 class="headline">
          Settings<img src="./assets/img/Line 3.svg" alt="Line 3" />
        </h1>
      </div>
      <div class="container-content">
        <div class="settings-options">
          <h3>
            <img src="./assets/icons/palette.svg" alt="Palette icon" />Game
            themes
          </h3>
          <div class="game-themes">
            <span class="theme-options-hv">
              <input type="radio" name="themes" id="code-themes" checked/>
              <label for="code-themes">Code vibes theme</label>
              <img
                class="theme-line"
                src="./assets/icons/Line 5.svg"
                alt="Code vibes icon"
              />
            </span>
            <span class="theme-options-hv">
              <input type="radio" name="themes" id="gaming-themes" />
              <label for="gaming-themes">Gaming theme</label>
              <img
                class="theme-line"
                src="./assets/icons/Line 5.svg"
                alt="Gaming icon"
              />
            </span>
            <span class="theme-options-hv">
              <input type="radio" name="themes" id="project-themes" />
              <label for="project-themes">DA Project theme</label>
              <img
                class="theme-line"
                src="./assets/icons/Line 5.svg"
                alt="DA Project icon"
              />
            </span>
            <span class="theme-options-hv">
              <input type="radio" name="themes" id="foods-themes" />
              <label for="foods-themes">Foods theme</label>
              <img
                class="theme-line"
                src="./assets/icons/Line 5.svg"
                alt="Foods icon"
              />
            </span>
          </div>
          <h3>
            <img src="./assets/icons/chess_pawn.svg" alt="Player icon" />Choose
            player
          </h3>
          <div class="choose-player">
            <span class="theme-options">
              <input type="radio" name="player" id="player-blue" />
              <label for="player-blue">Blue player</label>
              <img
                class="theme-line"
                src="./assets/icons/Line 5.svg"
                alt="Blue player icon"
              />
            </span>
            <span class="theme-options">
              <input type="radio" name="player" id="player-orange" />
              <label for="player-orange">Orange player</label>
              <img
                class="theme-line"
                src="./assets/icons/Line 5.svg"
                alt="Orange player icon"
              />
            </span>
          </div>
          <h3>
            <img src="./assets/icons/style.svg" alt="Board icon" />Board size
          </h3>
          <div class="board-size">
            <span class="theme-options">
              <input type="radio" name="board-size" id="small-board" />
              <label for="small-board">16 cards</label>
              <img
                class="theme-line"
                src="./assets/icons/Line 5.svg"
                alt="Small board icon"
              />
            </span>
            <span class="theme-options">
              <input type="radio" name="board-size" id="medium-board" />
              <label for="medium-board">24 cards</label>
              <img
                class="theme-line"
                src="./assets/icons/Line 5.svg"
                alt="Medium board icon"
              />
            </span>
            <span class="theme-options">
              <input type="radio" name="board-size" id="large-board" />
              <label for="large-board">32 cards</label>
              <img
                class="theme-line"
                src="./assets/icons/Line 5.svg"
                alt="Large board icon"
              />
            </span>
          </div>
        </div>
        <div class="settings-preview">
          <img
            class="theme-visual"
            src="./assets/img/Theme Visual.png"
            alt="Theme Visual"
          />
          <div class="settings-actions" id="set-actions">
            <div class="settings-items">
              <span id="game-theme">Game theme</span>
              <img src="./assets/icons/Line 7.svg" alt="Line separator" />
              <span id="player">Player</span>
              <img src="./assets/icons/Line 7.svg" alt="Line separator" />
              <span id="board-size">Board size</span>
              <a href="./playboard.html"><img src="./assets/icons/smart_display.svg" alt="Start icon" />Start</a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./src/settings.ts"></script>
  </body>
</html>
