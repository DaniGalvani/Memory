<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory - Settings</title>
  </head>
  <body>
    <main class="main-container">
      <div class="container">
        <h1 class="headline">
          Settings<img src="./assets/img/Line 3.svg" alt="Line 3" />
        </h1>
      </div>
      <div class="container-content">
        <h3>Game themes</h3>
        <div class="game-themes">
          <span>
            <input type="radio" name="themes" id="code-themes" />
            <label for="code-themes">Code vibes theme</label>
          </span>
          <span>
            <input type="radio" name="themes" id="gaming-themes" />
            <label for="gaming-themes">Gaming theme</label>
          </span>
          <span>
            <input type="radio" name="themes" id="project-themes" />
            <label for="project-themes">DA Project theme</label>
          </span>
          <span>
            <input type="radio" name="themes" id="foods-themes" />
            <label for="foods-themes">Foods theme</label>
          </span>
        </div>
        <h3>Choose player</h3>
        <div class="choose-player">
          <span>
            <input type="radio" name="player" id="player-blue" />
            <label for="player-blue">Blue player</label>
          </span>
          <span>
            <input type="radio" name="player" id="player-orange" />
            <label for="player-orange">Orange player</label>
          </span>
        </div>
        <h3>Board size</h3>
        <div class="board-size">
          <span>
            <input type="radio" name="board-size" id="small-board" />
            <label for="small-board">Small board</label>
          </span>
          <span>
            <input type="radio" name="board-size" id="medium-board" />
            <label for="medium-board">Medium board</label>
          </span>
          <span>
            <input type="radio" name="board-size" id="large-board" />
            <label for="large-board">Large board</label>
          </span>
        </div>
      </div>
    </main>
    <script type="module" src="./src/settings.ts"></script>
  </body>
</html>
